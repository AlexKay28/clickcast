name: Publish release (TestPyPI → PyPI → GitHub release)

on:
  push:
    tags:
      - 'v*'

# Top-level: read-only. Individual jobs elevate for OIDC / release creation.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Build the sdist + wheel and verify the tag matches pyproject
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches pyproject.toml version
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PYPROJ=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG"
          echo "pyproject=$PYPROJ"
          if [ "$TAG" != "$PYPROJ" ]; then
            echo "::error::tag v$TAG does not match pyproject.toml version $PYPROJ — bump one to match the other"
            exit 1
          fi
          # PEP 440 pre/dev release markers
          if [[ "$TAG" =~ (a|b|rc|\.dev|\.post) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - run: pip install --upgrade build
      - run: python -m build

      # Catch broken PyPI-project-page metadata (bad long_description
      # rendering, unknown classifier) BEFORE the wheel gets uploaded.
      # See #46 item 3.
      - name: Verify distribution metadata
        run: |
          pip install twine
          twine check dist/*

      - name: List built artifacts
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ------------------------------------------------------------------
  # Publish to TestPyPI (always, for every tag)
  # ------------------------------------------------------------------
  test-release:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: test-release
      url: https://test.pypi.org/project/clickcast/
    permissions:
      id-token: write   # for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        # SHA-pinned instead of the moving `release/v1` ref — a compromised
        # tag on that action would otherwise publish arbitrary code to PyPI
        # under our Trusted-Publishing OIDC identity. Bump the SHA + version
        # comment together when upgrading. See #46 item 5.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # ------------------------------------------------------------------
  # Smoke-install from TestPyPI on the full support matrix
  # ------------------------------------------------------------------
  smoke-test:
    needs: [build, test-release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for TestPyPI to serve this version
        # Poll TestPyPI's simple index from THIS runner's POP until the freshly-
        # uploaded version is visible. Cheaper than a blind sleep (early exits
        # when the edge is fast) and more reliable (curl and pip share the same
        # Fastly cache, so what curl sees, pip will see too). See #89 — every
        # release since v0.1.1 hit the flake with the previous `sleep 30`.
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf "https://test.pypi.org/simple/clickcast/" \
                 | grep -q "clickcast-${VERSION}"; then
              echo "clickcast==${VERSION} visible on TestPyPI simple index after ${i} attempts"
              exit 0
            fi
            echo "attempt $i/30: clickcast==${VERSION} not yet on simple index; sleeping 5s..."
            sleep 5
          done
          echo "::error::TestPyPI simple index never returned clickcast==${VERSION} within 150s"
          exit 1

      - name: Install from TestPyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "clickcast==${VERSION}"

      - name: Verify CLI runs
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          got=$(clickcast --version)
          if [ "$got" != "$VERSION" ]; then
            echo "::error::clickcast --version returned '$got', expected '$VERSION'"
            exit 1
          fi
          clickcast --help > /dev/null

      # Real smoke-test — exercises the reel pipeline and verifies bundled
      # resources (font + JSON schema) actually made it into the wheel. The
      # prior `--version`/`--help` block was a pure Python-import check; a
      # wheel missing `annotate/fonts/DejaVuSans.ttf` or `feedback/schema/v1.json`,
      # or with a broken `importlib.resources` path, would upload to PyPI green.
      # Motivated by the same class of "3.10 didn't work" bug the v0.2.2 -> v0.2.3
      # hotfix caught — a real invocation catches what an import check can't.
      # See #43 item 2.
      - name: Install Playwright chromium (for real smoke-test)
        run: python -m playwright install chromium

      - name: Smoke-test screenshot + bundled resources
        run: |
          set -euo pipefail
          clickcast shot 'data:text/html,<h1>x</h1>' --out /tmp/s.png
          test -s /tmp/s.png
          # PNG magic bytes: 89 50 4E 47 = "\x89PNG". Python check keeps the
          # comparison portable across od(1) formatting differences on
          # linux/macos.
          python -c "import sys; assert open('/tmp/s.png','rb').read(4) == b'\x89PNG', 'bad PNG magic'"
          python -c "
          from clickcast.annotate import Annotator
          import importlib.resources as r, json
          Annotator()   # loads bundled font
          json.loads((r.files('clickcast.feedback')/'schema/v1.json').read_text())
          "

  # ------------------------------------------------------------------
  # Publish to PyPI (only for non-prerelease tags)
  # ------------------------------------------------------------------
  release:
    needs: [build, smoke-test]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/clickcast/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # SHA-pinned; see the same-named step in `test-release`. See #46 item 5.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # ------------------------------------------------------------------
  # Cut a GitHub release with auto-generated notes + attached artifacts
  # ------------------------------------------------------------------
  gh-release:
    needs: [build, release]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --generate-notes \
            --title "$TAG" \
            dist/*.whl dist/*.tar.gz

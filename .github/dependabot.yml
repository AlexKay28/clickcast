version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    groups:
      dev-and-test-deps:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: ["npm/clickcast", "npm/clickcast-mcp"]
    schedule: { interval: weekly }

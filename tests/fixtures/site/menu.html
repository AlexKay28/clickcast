<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Menu — Clickcast Fixture</title>
  <style>
    body { font-family: sans-serif; margin: 20px; color: #222; }
    nav { background: #eef2f7; padding: 12px; margin-bottom: 20px; border-radius: 4px; }
    nav a { margin-right: 16px; color: #14509d; text-decoration: none; font-weight: 600; }
    #menu { margin: 12px 0; padding: 8px 16px; background: #f6f8fb; border-radius: 4px; }
    #menu li { margin: 6px 0; }
  </style>
</head>
<body>
  <nav aria-label="Primary">
    <a href="/" id="nav-home">Home</a>
    <a href="/form.html" id="nav-form">Form</a>
    <a href="/tabs.html" id="nav-tabs">Tabs</a>
  </nav>

  <main>
    <h1>Menu</h1>
    <button id="menu-toggle" aria-expanded="false" aria-controls="menu">Open menu</button>
    <ul id="menu" role="menu" hidden>
      <li role="none"><button role="menuitem">Profile</button></li>
      <li role="none"><button role="menuitem">Settings</button></li>
      <li role="none"><button role="menuitem">Sign out</button></li>
    </ul>
    <button id="detach-me">Detach me</button>
  </main>

  <script>
    const toggle = document.getElementById('menu-toggle');
    const menu = document.getElementById('menu');
    toggle.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', expanded ? 'false' : 'true');
      menu.hidden = expanded;
    });
  </script>
</body>
</html>

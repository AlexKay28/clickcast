# Template scenario for capturing a bug reproduction.
#
# Rename the file to match your bug number, fill in the steps that reproduce
# the failure, and pass it to `clickcast run`. Attach the resulting GIF +
# sidecar to the issue.
#
# Usage:
#   clickcast run demo/bug-report/reproduce-bug-42.yml \
#     --var base_url=https://app.example.com \
#     --out bug-42.gif

meta:
  name: "Reproduce bug #42"
  viewport: 1280x800
  fps: 12
  dwell: 0.6
  format: gif
  out: reel-bug-42.gif

steps:
  - action: goto
    url: "{{ base_url }}/the/broken/page"
    wait: networkidle
    dwell: 1.5
    label: "open broken page"

  # Fill in the exact clicks / types that trigger the failure.
  - action: click
    selector: 'role=button[name="Edit"]'
    label: "open editor"
    dwell: 1.0

  - action: type
    into: 'textarea[name="content"]'
    text: "example content that triggers the bug"
    label: "enter content"

  - action: click
    selector: 'role=button[name="Save"]'
    label: "click save (this is where it fails)"
    # `optional: true` means the sidecar records the failure but the tour
    # continues — you still get frames of the broken state.
    optional: true
    dwell: 3.0

  - action: screenshot
    full_page: true
    label: "capture the failure state"
